</style></head><body><main class="wrap"><h1 id="pageTitle">⚫ 오목 & 바둑 ⚪</h1><section id="setup" class="panel"><h2>게임 설정</h2><div class="grid"><div><label for="gameType">게임 종류</label><select id="gameType"><option value="gomoku">오목</option><option value="go">바둑</option><option value="study">바둑 공부 · 문제 풀이</option><option value="tsumego">사활 문제 · 자동 응수</option></select></div><div><label for="boardSize">게임판 크기</label><select id="boardSize"></select></div><div id="handicapBox" class="hidden"><label for="handicap">접바둑 · 흑돌 미리 놓기</label><select id="handicap"><option value="0">호선 (0점)</option><option value="2">2점</option><option value="3">3점</option><option value="4">4점</option><option value="5">5점</option><option value="6">6점</option><option value="7">7점</option><option value="8">8점</option><option value="9">9점</option></select></div><div id="problemBox" class="hidden"><label for="problem">연습 문제</label><select id="problem"><option value="0">1. 단수 돌 따내기 (초급)</option><option value="1">2. 백돌 두 점 따내기 (초급)</option><option value="2">3. 구석 백돌 따내기 (초급)</option><option value="3">4. 흑돌 세 점 살리기 (초급)</option></select></div><div id="tsumegoBox" class="hidden"><label for="tsumegoLevel">사활 난이도</label><select id="tsumegoLevel"><option value="all">전체 50문제</option><option value="easy">초급 20문제</option><option value="medium">중급 20문제</option><option value="hard">고급 10문제</option></select><p class="muted">흑이 먼저 두고 백이 자동으로 응수하는 오프라인 수읽기 문제입니다.</p></div><div><label for="p1">흑돌 플레이어</label><input id="p1" maxlength="20" value="Player 1" autocomplete="off"></div><div><label for="p2">백돌 플레이어</label><input id="p2" maxlength="20" value="Player 2" autocomplete="off"></div></div><p id="setupInfo" class="muted"></p><button id="start" style="width:100%">게임 시작</button></section><section id="game" class="hidden"><div class="panel"><div class="grid"><div class="player active" id="blackCard"><div class="name"><span class="stone black"></span><span id="blackName"></span></div><div class="muted" id="blackInfo"></div></div><div class="player" id="whiteCard"><div class="name"><span class="stone white"></span><span id="whiteName"></span></div><div class="muted" id="whiteInfo"></div></div></div><div class="status" id="status" aria-live="polite"></div><div id="studyHint" class="study-hint hidden"></div><div id="tsumegoTools" class="actions hidden" style="margin:9px 0"><button class="secondary" id="tsumegoHint">💡 힌트</button><button class="secondary" id="tsumegoAnswer">📖 정답·해설</button><button class="secondary" id="tsumegoPrev">◀ 이전 문제</button></div><div id="deadHelp" class="study-hint hidden">사석 정리 중: 죽은 돌 무리를 터치하면 빨간 X로 표시됩니다. 다시 터치하면 복원됩니다. 양쪽이 확인한 후 '계가 확정'을 누르세요.</div><div class="board-area"><div class="board-wrap"><canvas id="board" aria-label="바둑판. 교차점을 터치하거나 클릭하여 착수" role="img"></canvas></div><div id="victory" class="victory hidden" role="dialog" aria-modal="false" aria-label="게임 결과"><div id="fireworks"></div><div class="victory-card"><div class="victory-trophy">🏆</div><div id="victoryTitle" class="victory-title"></div><div id="victorySubtitle" class="victory-sub"></div><div id="victorySummary" class="victory-summary hidden"></div><button class="victory-close" id="victoryClose">바둑판 보기</button></div></div><canvas id="minimap" class="minimap hidden" aria-label="미니맵: 드래그로 게임판 이동, 0.5초 길게 누른 후 드래그로 미니맵 자체 이동"></canvas></div><div class="actions zoom-actions"><button class="secondary" id="zoomOut">− 축소</button><button class="secondary" id="zoomReset">100%</button><button class="secondary" id="zoomIn">+ 확대</button></div><div class="actions option-actions"><button class="secondary" id="soundToggle" aria-pressed="true">🔊 효과음 켜짐</button><button class="secondary" id="miniToggle" aria-pressed="true">🗺️ 미니맵 켜짐</button></div><div class="stats"><span id="moveCount">착수 0</span><span id="gameLabel"></span></div></div><div class="panel"><div class="actions"><button class="secondary" id="undo">↶ 무르기</button><button class="secondary hidden" id="pass">패스</button><button class="secondary hidden" id (()=>{'use strict';const $=id=>document.getElementById(id);let studyStep=0;let tsumegoIndex=0,tsumegoStep=0,tsumegoDone=false,tsumegoHintCount=0,tsumegoShowAnswer=false;const tsumegoProgressKey='baduk_tsumego_v8_progress';let state=null,history=[],lastPos=null,gameOver=false,passes=0,positionHistory=new Set(),toastTimer,territoryOverlay=null,deadSet=new Set(),scoringMode=false,savedResult=null,studySolved=false,zoom=1,offsetX=0,offsetY=0;const activePointers=new Map();let gesture=null,suppressTap=false,soundEnabled=true,minimapEnabled=true,audioContext=null;const canvas=$('board'),ctx=canvas.getContext('2d');let cssSize=0,cell=0,pad=0;const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
function sizes(){const type=$('gameType').value,go=type==='go',opts=(type==='study'||type==='tsumego')?[9]:go?[9,13,19]:[15,19];$('boardSize').innerHTML=opts.map(n=>`<option value="${n}"${n===(go?19:15)?' selected':''}>${n} × ${n}</option>`).join('');$('handicapBox').classList.toggle('hidden',!go);$('problemBox').classList.toggle('hidden',type!=='study');$('tsumegoBox').classList.toggle('hidden',type!=='tsumego');$('setupInfo').textContent=type==='tsumego'?'사활 연습 50문제: 흑이 먼저 두며 백이 정해진 방어 수순으로 응수합니다. 힌트와 해설을 확인할 수 있습니다.':type==='study'?'바둑 문제 24개: 1~4수 연속 착수로 백돌을 포위하는 연습입니다. 연속 수순에서는 백이 패스합니다.':go?'바둑: 돌 따내기, 자충수 금지, 단순 패 금지, 패스 및 간이 계가를 지원합니다.':'오목: 먼저 연속 5개 이상을 놓으면 승리합니다. 금수 없는 자유룰입니다.'} $('gameType').addEventListener('change',sizes);sizes();
function key(b){return b.join('')}function copy(){return {board:state.board.slice(),turn:state.turn,moves:state.moves,captures:state.captures.slice(),passes,gameOver,lastPos:lastPos===null?null:lastPos,positionHistory:[...positionHistory],deadSet:[...deadSet],scoringMode,territoryOverlay:territoryOverlay?territoryOverlay.slice():null}}function restore(s){state.board=s.board.slice();state.turn=s.turn;state.moves=s.moves;state.captures=s.captures.slice();passes=s.passes;gameOver=s.gameOver;lastPos=s.lastPos;positionHistory=new Set(s.positionHistory);deadSet=new Set(s.deadSet||[]);scoringMode=!!s.scoringMode;territoryOverlay=s.territoryOverlay?s.territoryOverlay.slice():null}
function neighbors(pos){let x=pos%state.n,y=Math.floor(pos/state.n),out=[];for(const [dx,dy] of dirs){const a=x+dx,b=y+dy;if(a>=0&&a<state.n&&b>=0&&b<state.n)out.push(b*state.n+a)}return out}
function group(board,start){const color=board[start],seen=new Set([start]),stack=[start],lib=new Set();while(stack.length){for(const p of neighbors(stack.pop())){if(board[p]===0)lib.add(p);else if(board[p]===color&&!seen.has(p)){seen.add(p);stack.push(p)}}}return {stones:[...seen],liberties:lib.size}}

function stoneSound(){

 try{
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;

  const t=audioContext.currentTime,osc=audioContext.createOscillator(),gain=audioContext.createGain(),filter=audioContext.createBiquadFilter();

}
$('soundToggle').onclick=()=>{soundEnabled=!soundEnabled;$('soundToggle').textContent=soundEnabled?'🔊 효과음 켜짐':'🔇 효과음 꺼짐';$('soundToggle').setAttribute('aria-pressed',String(soundEnabled))};
$('miniToggle').onclick=()=>{minimapEnabled=!minimapEnabled;$('miniToggle').textContent=minimapEnabled?'🗺️ 미니맵 켜짐':'🗺️ 미니맵 꺼짐';$('miniToggle').setAttribute('aria-pressed',String(minimapEnabled));if(!minimapEnabled)resetMiniGesture();if(state)render()};

 const target=$('victorySummary');target.replaceChildren();target.classList.toggle('hidden',!summary);
 if(summary){const table=document.createElement('table');const rows=[['항목','흑돌','백돌'],['집',summary.territory[0],summary.territory[1]],['사석 (잡은 돌)',summary.prisoners[0],summary.prisoners[1]],['덤',0,summary.komi],['총점',summary.total[0],summary.total[1]]];rows.forEach((r,i)=>{const tr=document.createElement('tr');r.forEach(v=>{const el=document.createElement(i?'td':'th');el.textContent=String(v);tr.append(el)});table.append(tr)});target.append(table);const note=document.createElement('div');note.style.marginTop='8px';note.textContent='차이 '+summary.margin+'집 · 일본식 집계산 (집 + 사석 + 덤) · 사석은 대국자 확인 후 제거';target.append(note)}
 const fireworks=$('fireworks');fireworks.replaceChildren();const colors=['#ffd66d','#ff6b8a','#6edbff','#9affb3','#e9a6ff'];for(let k=0;k<8;k++){const f=document.createElement('div');f.className='firework';f.style.setProperty('--x',(12+(k*37)%78)+'%');f.style.setProperty('--y',(12+(k*29)%70)+'%');for(let j=0;j<12;j++){const dot=document.createElement('i');dot.style.setProperty('--a',(j*30)+'deg');dot.style.setProperty('--dist',(45+(k%3)*12)+'px');dot.style.setProperty('--delay',(k*.19)+'s');dot.style.setProperty('--c',colors[(k+j)%colors.length]);f.append(dot)}fireworks.append(f)}$('victory').classList.remove('hidden');
}

 history.push(old);stoneSound();territoryOverlay=null;state.board=board;state.captures[color-1]+=captured;state.moves++;lastPos=pos;passes=0;if(state.type==='go')positionHistory.add(key(board));if(state.type==='gomoku'&&win(pos,color)){gameOver=true;render();$('status').textContent=`🏆 ${state.names[color-1]} 승리!`;showVictory(state.names[color-1],'오목 · 5목 완성!');return}state.turn=3-color;render()}

 state.board=trial;state.moves++;studyStep++;lastPos=pos;stoneSound();if(studyStep===p.steps.length){studySolved=true;$('status').textContent=`🎉 문제 ${Number($('problem').value)+1} 해결!`;$('studyHint').textContent=`✅ 정답! ${p.title} · ${studyStep}/${p.steps.length}수 완료 · 백돌 ${caught}개를 잡았습니다. 다음 문제로 진행하세요.`;notify('정답입니다! 🎉')}else{$('status').textContent=`흑 ${studyStep}수 완료 · 백 패스 · 흑 차례`;$('studyHint').textContent=`${p.title} · ${studyStep}/${p.steps.length}수 성공! 백이 패스했습니다. 다음 수를 찾아보세요.`;notify(`좋아요! ${studyStep}/${p.steps.length}수 · 백 패스`)}render()}

 // 사활 연습: 10개 기본 형태를 회전·반사해 50개 수읽기 수순으로 구성.
 // 백은 미리 검증된 응수로 착수하며, 일반 바둑 AI처럼 모든 변화를 탐색하지는 않습니다.
 const tsumegoTemplates=[
 {name:'중앙 단수의 맥',white:[[4,4]],black:[[3,4],[4,3]],moves:[[5,4],[4,5]],goal:'중앙 백돌 따내기'},
 {name:'두 점의 활로',white:[[4,4],[5,4]],black:[[3,4],[4,3],[5,3],[6,4]],moves:[[4,5],[5,5]],goal:'연결된 백 두 점 따내기'},
 {name:'세로 연결 끊기',white:[[4,4],[4,5]],black:[[3,4],[3,5],[4,3],[4,6]],moves:[[5,4],[5,5]],goal:'백 두 점의 마지막 활로 막기'},
 {name:'귀의 급소',white:[[0,0]],black:[],moves:[[1,0],[0,1]],goal:'귀의 백돌 따내기'},
 {name:'변의 수읽기',white:[[0,4]],black:[[0,5]],moves:[[1,4],[0,3]],goal:'변의 백돌 따내기'},
 {name:'세 점 포위',white:[[4,4],[5,4],[6,4]],black:[[3,4],[7,4],[4,3],[5,3],[6,3],[4,5]],moves:[[5,5],[6,5]],goal:'백 세 점 따내기'},
 {name:'중앙의 세 활로',white:[[4,4]],black:[[3,4]],moves:[[4,3],[5,4],[4,5]],goal:'백 한 점 따내기'},
 {name:'연결된 두 점의 약점',white:[[4,4],[5,4]],black:[[3,4],[6,4],[4,5],[5,5]],moves:[[4,3],[5,3]],goal:'백 두 점 따내기'},
 {name:'변의 삼수 포위',white:[[0,4]],black:[],moves:[[1,4],[0,3],[0,5]],goal:'백 한 점 따내기'},
 {name:'네 수로 만드는 포위',white:[[4,4]],black:[],moves:[[3,4],[4,3],[5,4],[4,5]],goal:'백 한 점 따내기'}
 ];
 function transformTsumego(pts,t){return pts.map(([x,y])=>{if(t>=4)x=8-x;for(let j=0;j<t%4;j++)[x,y]=[8-y,x];return [x,y]})}
 const tsumegoProblems=Array.from({length:50},(_,i)=>{
   const base=tsumegoTemplates[i%10],t=Math.floor(i/10),black=transformTsumego(base.black,t),white=transformTsumego(base.white,t),moves=transformTsumego(base.moves,t);
   const difficulty=i<20?'초급':i<40?'중급':'고급';
   return {title:base.name,black,white,moves,difficulty,goal:base.goal,explain:`${base.goal}. 흑의 정답 수순은 ${moves.length}수이며, 백은 각 흑 착수 후 자동 응수합니다.`,reply:[]};
 });
 function tsumegoStartIndex(){const v=$('tsumegoLevel').value;return v==='medium'?20:v==='hard'?40:0}
 function nextTsumegoIndex(d){const level=$('tsumegoLevel').value;let a=0,b=49;if(level==='easy')b=19;else if(level==='medium'){a=20;b=39}else if(level==='hard')a=40;return tsumegoIndex+d>b?a:tsumegoIndex+d<a?b:tsumegoIndex+d}
 function tsumegoApply(color,xy){const pos=xy[1]*9+xy[0];if(state.board[pos])return false;const board=state.board.slice();board[pos]=color;for(const q of neighbors(pos)){if(board[q]!==3-color)continue;const g=group(board,q);if(g.liberties===0)g.stones.forEach(k=>board[k]=0)}if(group(board,pos).liberties===0)return false;state.board=board;state.moves++;lastPos=pos;stoneSound();return true}
 function tsumegoPickReply(p){
  // 지정된 정답 수순을 방해하지 않으면서 국소적인 백 응수를 선택한다.
  const future=new Set(p.moves.map(([x,y])=>y*9+x));
  const target=p.white[0];let choices=[];
  for(let y=0;y<9;y++)for(let x=0;x<9;x++){
   const pos=y*9+x;if(state.board[pos]||future.has(pos))continue;
   const dist=Math.abs(x-target[0])+Math.abs(y-target[1]);
   if(dist<4||dist>6)continue;if(p.white.some(([wx,wy])=>Math.abs(wx-x)+Math.abs(wy-y)<=1))continue;
   choices.push({x,y,dist});
  }
  choices.sort((a,b)=>a.dist-b.dist||a.y-b.y||a.x-b.x);
  for(const v of choices){if(tsumegoApply(2,[v.x,v.y]))return [v.x,v.y]}
  return null;
 }
 function loadTsumego(){const p=tsumegoProblems[tsumegoIndex];state.board.fill(0);for(const [x,y] of p.black)state.board[y*9+x]=1;for(const [x,y] of p.white)state.board[y*9+x]=2;state.turn=1;state.moves=0;state.captures=[0,0];lastPos=null;history=[];tsumegoStep=0;tsumegoDone=false;tsumegoHintCount=0;tsumegoShowAnswer=false;$('status').textContent=`🧠 사활 ${tsumegoIndex+1}/50 · ${p.difficulty} · 흑 선공`;$('studyHint').textContent=`${p.title} · ${p.goal} · 흑 ${p.moves.length}수 문제. (0/${p.moves.length})`;}
 function tryTsumego(pos){if(tsumegoDone)return;const p=tsumegoProblems[tsumegoIndex],xy=[pos%9,Math.floor(pos/9)],expected=p.moves[tsumegoStep];if(xy[0]!==expected[0]||xy[1]!==expected[1]){notify('이 문제의 정답 수순과 다릅니다. 다시 생각해 보세요.');return}
  if(!tsumegoApply(1,xy)){notify('이곳에는 착수할 수 없습니다.');return}
  tsumegoStep++;
  if(tsumegoStep===p.moves.length){tsumegoDone=true;let done=[];try{done=JSON.parse(localStorage.getItem(tsumegoProgressKey)||'[]')}catch(_){}if(!done.includes(tsumegoIndex))done.push(tsumegoIndex);try{localStorage.setItem(tsumegoProgressKey,JSON.stringify(done))}catch(_){}$('status').textContent=`🎉 ${p.difficulty} ${tsumegoIndex+1}번 문제 성공!`;$('studyHint').textContent=`✅ ${p.explain} · 누적 완료 ${done.length}/50`;notify('정답입니다! 🏆');render();return}
  const reply=tsumegoPickReply(p);$('status').textContent=`백 자동 응수 ${reply?`(${reply[0]+1}, ${reply[1]+1})`:'패스'} · 흑 차례`;$('studyHint').textContent=`${p.title} · ${tsumegoStep}/${p.moves.length}수 · 다음 흑의 수를 찾으세요.`;render();
 }
 $('tsumegoHint').onclick=()=>{if(state?.type!=='tsumego')return;const p=tsumegoProblems[tsumegoIndex];if(tsumegoDone){notify('이미 해결한 문제입니다.');return}const [x,y]=p.moves[tsumegoStep];tsumegoHintCount++;$('studyHint').textContent=`💡 힌트 ${tsumegoHintCount}: 다음 흑의 착수는 ${x+1}열 ${y+1}행입니다. · ${p.goal}`};
 $('tsumegoAnswer').onclick=()=>{if(state?.type!=='tsumego')return;const p=tsumegoProblems[tsumegoIndex];const moves=p.moves.map(([x,y],i)=>`${i+1}수 (${x+1},${y+1})`).join(' → ');$('studyHint').textContent=`📖 ${p.explain} 정답: ${moves}. 이 모드는 미리 정해진 백 응수로 진행하는 학습용 수읽기 연습입니다.`;notify('정답 수순과 해설을 표시했습니다.')};
 $('tsumegoPrev').onclick=()=>{if(state?.type!=='tsumego')return;tsumegoIndex=nextTsumegoIndex(-1);loadTsumego();render()};
 $('tsumegoLevel').addEventListener('change',()=>{if(state?.type==='tsumego'){tsumegoIndex=tsumegoStartIndex();loadTsumego();render()}});

 function toggleDead(pos){if(!state.board[pos])return;const g=group(state.board,pos);const mark=!deadSet.has(pos);for(const p of g.stones){if(mark)deadSet.add(p);else deadSet.delete(p)}render();notify(`${g.stones.length}개 돌 ${mark?'사석 표시':'사석 표시 취소'}`)}
 function beginScoring(){if(!state||state.type!=='go'||scoringMode)return;hideVictory();scoringMode=true;deadSet.clear();territoryOverlay=null;$('score').classList.add('hidden');$('scoreConfirm').classList.remove('hidden');$('scoreCancel').classList.remove('hidden');$('deadHelp').classList.remove('hidden');$('status').textContent='계가 준비 · 죽은 돌 무리를 선택하세요';render()}
 function cancelScoring(){scoringMode=false;deadSet.clear();territoryOverlay=null;$('score').classList.remove('hidden');$('scoreConfirm').classList.add('hidden');$('scoreCancel').classList.add('hidden');$('deadHelp').classList.add('hidden');render()}
 function scoring(){if(!scoringMode)return;const b=state.board.slice(),prisoners=state.captures.slice();for(const p of deadSet){const color=b[p];if(color)prisoners[2-color]++;b[p]=0}const seen=new Set(),territory=[0,0];territoryOverlay=Array(b.length).fill(0);for(let i=0;i<b.length;i++){if(b[i]||seen.has(i))continue;const region=[],colors=new Set(),stack=[i];seen.add(i);while(stack.length){const v=stack.pop();region.push(v);for(const q of neighbors(v)){if(b[q])colors.add(b[q]);else if(!seen.has(q)){seen.add(q);stack.push(q)}}}if(colors.size===1){const color=[...colors][0];territory[color-1]+=region.length;region.forEach(v=>territoryOverlay[v]=color)}}state.board=b;scoringMode=false;deadSet.clear();const komi=state.handicap>=2?0.5:6.5,black=territory[0]+prisoners[0],white=territory[1]+prisoners[1]+komi;gameOver=true;passes=0;render();$('scoreConfirm').classList.add('hidden');$('scoreCancel').classList.add('hidden');$('deadHelp').classList.add('hidden');$('score').classList.add('hidden');$('pass').disabled=true;$('resultAgain').classList.remove('hidden');const winner=black===white?null:state.names[black>white?0:1];savedResult={winner,subtitle:`바둑 · ${Math.abs(black-white)}집 차이`,summary:{territory,prisoners,komi,total:[black,white],margin:Math.abs(black-white)}};$('status').textContent=`🏆 ${winner||'무승부'} · 흑 ${black} : 백 ${white}`;showVictory(savedResult.winner,savedResult.subtitle,savedResult.summary);notify('계가 완료 · 집과 사석을 확인하세요')}
 $('score').onclick=beginScoring;$('scoreConfirm').onclick=()=>{if(confirm('사석 표시를 확인했습니다. 계가를 확정할까요?'))scoring()};$('scoreCancel').onclick=cancelScoring;$('resultAgain').onclick=()=>{if(savedResult)showVictory(savedResult.winner,savedResult.subtitle,savedResult.summary)};
 $('studyReset').onclick=()=>{if(state?.type==='study'){loadProblem();render()}else if(state?.type==='tsumego'){loadTsumego();render()}};$('studyNext').onclick=()=>{if(state?.type==='study'){$('problem').selectedIndex=($('problem').selectedIndex+1)%problems.length;loadProblem();render()}else if(state?.type==='tsumego'){tsumegoIndex=nextTsumegoIndex(1);loadTsumego();render()}};
 window.addEventListener('resize',()=>{if(state)render()});
 function armBack(){try{historyAPI()}catch(_){}}
 function historyAPI(){if(location.protocol==='file:')return;window.history.pushState({boardGameGuard:true},'','#play')}
 armBack();window.addEventListener('popstate',()=>{if(state){if(confirm('게임 선택 화면으로 돌아갈까요? 현재 대국은 종료됩니다.'))showSetup();armBack()}else{if(confirm('게임을 종료하시겠습니까?')){window.close();notify('브라우저에서 직접 연 페이지는 뒤로가기를 다시 누르거나 탭을 닫아 종료해 주세요.')}else armBack()}});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Backspace'&&e.target.tagName!=='INPUT'&&e.target.tagName!=='SELECT'){e.preventDefault();if(state){if(confirm('게임 선택 화면으로 돌아갈까요? 현재 대국은 종료됩니다.'))showSetup()}else if(confirm('게임을 종료하시겠습니까?'))window.close()}});

})();
